
name: Deploy Flask App to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::583960588058:role/OICD-role
          aws-region: us-east-1

      # Step 3: Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 4: Connect to EC2 and deploy Flask
      - name: Deploy Flask Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "Connected to EC2 successfully"

            # Install Python requirements
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            # Create application directory
            mkdir -p /home/ubuntu/flask-app
            cd /home/ubuntu/flask-app

            # Create virtual environment
            python3 -m venv venv

            # Install Flask
            ./venv/bin/pip install flask

            # Create Python Flask application
            cat > app.py <<'EOF'
            from flask import Flask

            app = Flask(__name__)

            @app.route("/")
            def home():
                return "Hello! Flask Application Deployed Successfully using GitHub Actions!"

            @app.route("/health")
            def health():
                return {"status": "healthy"}

            if __name__ == "__main__":
                app.run(host="0.0.0.0", port=5000)
            EOF

            # Create systemd service
            sudo tee /etc/systemd/system/flask-app.service > /dev/null <<'EOF'
            [Unit]
            Description=Python Flask Application
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu/flask-app
            ExecStart=/home/ubuntu/flask-app/venv/bin/python /home/ubuntu/flask-app/app.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            # Enable and restart Flask service
            sudo systemctl daemon-reload
            sudo systemctl enable flask-app
            sudo systemctl restart flask-app

            # Verify service
            sudo systemctl is-active flask-app

            echo "Flask application deployed successfully!"
