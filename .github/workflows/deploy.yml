
name: Deploy Flask App to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: AWS OIDC Authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::583960588058:role/OICD-role
          aws-region: us-east-1

      # Step 3: Verify AWS Authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 4: Connect to EC2 and Deploy Flask
      - name: Deploy Flask Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            echo "Connected to EC2 successfully"

            # Install required packages
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            # Create application directory
            mkdir -p ~/flask-app
            cd ~/flask-app

            # Create virtual environment
            python3 -m venv venv

            # Activate virtual environment
            source venv/bin/activate

            # Install Flask
            pip install flask

            # Create Flask application
            cat > app.py <<'EOF'
            from flask import Flask

            app = Flask(__name__)

            @app.route("/")
            def home():
                return "Hello! Flask Application Deployed Successfully using GitHub Actions!"

            @app.route("/health")
            def health():
                return {"status": "healthy"}

            if __name__ == "__main__":
                app.run(host="0.0.0.0", port=5000)
            EOF

            # Stop previous application if running
            pkill -f "python app.py" || true

            # Start Flask application in background
            nohup ~/flask-app/venv/bin/python ~/flask-app/app.py > ~/flask-app/app.log 2>&1 < /dev/null &

            echo "Flask application deployment completed"

